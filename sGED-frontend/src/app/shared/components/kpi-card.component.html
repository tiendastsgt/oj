<div class="kpi-card">
  <div class="kpi-icon-box" [ngClass]="color()">
    <i class="pi" [ngClass]="icon()"></i>
  </div>
  <div class="kpi-content">
    <div class="kpi-value">{{ value() }}</div>
    <div class="kpi-label">{{ label() }}</div>
    @if (trend(); as t) {
      <div class="kpi-trend" [class.up]="t > 0" [class.down]="t < 0">
        <i class="pi" [ngClass]="t > 0 ? 'pi-arrow-up' : 'pi-arrow-down'"></i>
        {{ t }}% desde ayer
      </div>
    }
  </div>
</div>
